<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DJ Stakato - Mashup Edits</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>

  <header class="top">
    <div class="brand">
      <div class="title">DJ STAKATO</div>
      <div class="subtitle">Mashup Edits · pick a volume</div>
    </div>
  </header>

  <!-- Landing -->
  <main id="landing" class="landing">
    <button class="cover" id="pickPeak" aria-label="Open Peak">
      <img id="imgPeak" alt="Peak cover" />
      <div class="enterCorner">click to enter</div>
    </button>

    <button class="cover" id="pickLeft" aria-label="Open Left Field">
      <img id="imgLeft" alt="Left Field cover" />
      <div class="enterCorner">click to enter</div>
    </button>
  </main>

  <!-- App -->
  <main id="app" class="app hidden">
    <section class="hero">
      <img id="heroImg" class="heroImg" alt="Selected volume cover" />
      <div class="heroText">
        <div id="heroVol" class="heroVol">VOLUME</div>
        <div id="heroName" class="heroName">TITLE</div>

        <div class="heroActions">
          <select id="volumeSwitch" class="select" aria-label="Choose volume">
            <option value="peak">Volume 1: Peak</option>
            <option value="leftfield">Volume 2: Left Field</option>
          </select>

          <select id="genre" class="select" aria-label="Genre filter">
            <option value="">All genres</option>
          </select>

          <button id="shuffle" class="btn">Shuffle</button>
        </div>

        <div id="stats" class="stats"></div>
      </div>
    </section>

    <section id="list" class="list"></section>
  </main>

  <footer id="player" class="player hidden">
    <div class="now">
      <div id="nowTitle" class="nowTitle">Nothing playing</div>
      <div id="nowMeta" class="nowMeta"></div>
    </div>

    <div class="controls">
      <button id="prev" class="icon" title="Previous">⏮</button>
      <button id="playPause" class="icon big" title="Play/Pause">▶</button>
      <button id="next" class="icon" title="Next">⏭</button>
    </div>

    <div class="progress">
      <div class="timeRow">
        <span id="tCur">0:00</span>
        <span id="tDur">0:00</span>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" />
    </div>

    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  </footer>

  <script src="app.js"></script>
</body>
</html>
