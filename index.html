<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DJ Stakato - Mashup Edits</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-noise"></div>
  <div class="bg-scanlines"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo glitch" data-text="DJ STAKATO RADIO">DJ STAKATO RADIO</div>
      <div class="sub">mashup edits · underground signal</div>
    </div>

    <div class="top-controls">
      <select id="station" class="select">
        <option value="peak">VOL 1: PEAK</option>
        <option value="leftfield">VOL 2: LEFT FIELD</option>
      </select>

      <button id="shuffleAll" class="chip">SHUFFLE</button>
      <button id="glitch" class="chip">GLITCH</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">FILTERS</div>

        <input id="search" class="search" placeholder="search title, artist, genre, year" />

        <div class="mini-row">
          <div class="mini-label">Sort</div>
          <select id="sort" class="select small">
            <option value="title">Title</option>
            <option value="artist">Artist</option>
            <option value="year">Year</option>
            <option value="genre">Genre</option>
          </select>
        </div>

        <div class="mini-row">
          <div class="mini-label">Genre</div>
          <select id="genre" class="select small">
            <option value="">All</option>
          </select>
        </div>

        <div class="hint">
          Tip: click a track to play. Hit GLITCH for chaos.
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">RECENT</div>
        <div id="recent" class="recent"></div>
      </div>
    </aside>

    <section class="content">
      <div class="statsbar">
        <div id="stats" class="stats">Loading…</div>
        <div class="signal">
          <span class="dot"></span> LIVE SIGNAL
        </div>
      </div>

      <div id="list" class="list"></div>
    </section>
  </main>

  <footer class="player">
    <div class="now">
      <div id="nowTitle" class="now-title">Nothing playing</div>
      <div id="nowMeta" class="now-meta"></div>
    </div>

    <div class="controls">
      <button id="prev" class="btn" title="Previous">⏮</button>
      <button id="playPause" class="btn big" title="Play or pause">▶</button>
      <button id="next" class="btn" title="Next">⏭</button>
    </div>

    <div class="timeline">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" />
      <span id="dur">0:00</span>
    </div>

    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  </footer>

  <script src="app.js"></script>
</body>
</html>
